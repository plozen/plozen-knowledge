services:
  plozen-knowledge-postgres:
    image: pgvector/pgvector:pg16
    container_name: plozen-knowledge-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - plozen-knowledge-postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  plozen-knowledge-api:
    build:
      context: .
    container_name: plozen-knowledge-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: plozen-knowledge-postgres
      API_PORT: 8100
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8100}:8100"
    depends_on:
      plozen-knowledge-postgres:
        condition: service_healthy

volumes:
  plozen-knowledge-postgres-data:
