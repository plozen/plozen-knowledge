[project]
name = "plozen-knowledge"
version = "0.1.0"
description = "PLOZEN Knowledge RAG API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "openai>=1.0.0",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.26",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
